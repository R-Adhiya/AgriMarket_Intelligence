version: "3.9"

# ── AgriMarket Intelligence — Docker Compose ─────────────────────────────────
#
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in values.
#   2. Copy frontend/.env.example to frontend/.env and set VITE_API_BASE_URL.
#   3. docker compose up --build
#
# Services:
#   db        — PostgreSQL 15
#   backend   — FastAPI (runs migrations on startup)
#   frontend  — React SPA served via nginx
#
# The backend is accessible at http://localhost:8000
# The frontend is accessible at http://localhost:3000
# API docs: http://localhost:8000/docs
#
# NOTE: Never commit real secrets. Set all passwords via environment variables
#       or a .env file that is excluded from version control.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrimarket}
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agrimarket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to use the Docker db service
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agrimarket}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # Mount ML models so the container can load trained artifacts
      - ./ml:/app/ml:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time API URL — frontend calls this from the browser
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
